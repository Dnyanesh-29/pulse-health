<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082317" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="60%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#2D6A4F" stroke-width="2" />

  <!-- Subtle Medical Cross Accent (top-right) -->
  <g opacity="0.35">
    <rect x="47" y="10" width="3" height="9" rx="1" fill="#00F5A0" />
    <rect x="44" y="13" width="9" height="3" rx="1" fill="#00F5A0" />
  </g>

  <!-- High-contrast EKG / Heartbeat Pulse Line -->
  <path
    d="M 9 33 L 20 33 L 26 17 L 35 49 L 43 21 L 49 37 L 53 33 L 56 33"
    fill="none"
    stroke="url(#pulseLine)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Active Pulse Node Indicator -->
  <circle cx="43" cy="21" r="3" fill="#FFFFFF" />
  <circle cx="43" cy="21" r="5" fill="none" stroke="#00F5A0" stroke-width="1.5" opacity="0.8" />
</svg>
